services:
  db:
    image: postgres
    restart: unless-stopped
    shm_size: 128mb

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  adminer:
    image: adminer
    restart: unless-stopped

    ports:
      - 8080:8080

    depends_on:
      - db

volumes:
  postgres_data:
