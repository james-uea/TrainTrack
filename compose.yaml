services:
  db:
    # Postgres 18 with PostGIS (docker/db/Dockerfile)
    build: docker/db
    image: traintrack-db
    restart: unless-stopped
    shm_size: 128mb

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  adminer:
    image: adminer
    restart: unless-stopped

    ports:
      - 8080:8080

    depends_on:
      - db

  # Applies migrations, then consumes the Darwin Push Port
  consumer:
    build: .
    restart: unless-stopped
    command: sh -c "python src/migrate.py && python src/consumer.py"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@db:5432/${POSTGRES_DB}
    depends_on:
      - db

  # Serves live positions and the map on http://localhost:8000. MAP_CLOCK (in .env) can replay a past moment
  api:
    build: .
    restart: unless-stopped
    command: python src/api.py --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      - db

  # Records what the map shows every 5 s, so any moment can be replayed
  recorder:
    build: .
    restart: unless-stopped
    command: python src/recorder.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@db:5432/${POSTGRES_DB}
    depends_on:
      - consumer

  # Loads the timetable on start, then again every day after the new files arrive (~04:00), then runs retention.py
  timetable:
    build: .
    restart: unless-stopped
    command: python src/initialise.py --daily 05:00
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@db:5432/${POSTGRES_DB}
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
      - ./data/archive:/app/data/archive # retention.py archives expired events here
    depends_on:
      - consumer

volumes:
  postgres_data:
