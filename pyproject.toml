[project]
name = "traintrack"
version = "0.5.0"
description = "Live tracking of UK trains"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.0",
    "lxml>=6.1.3",
    "networkx>=3.7",
    "psycopg[binary]>=3.3.5",
    "pyproj>=3.8.0",
    "pyshp>=3.1.9",
    "python-dotenv>=1.2.3",
    "shapely>=2.2.0",
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.16.6",
    "types-lxml>=2026.2.16",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
