[project]
name = "traintrack"
version = "0.4.0"
description = "Live tracking of UK trains"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.0",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "types-lxml>=2026.2.16",
]
